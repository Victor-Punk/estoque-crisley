<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estoque">
<title>Meu Estoque</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1b18;--mut:#6b675f;--bd:#e0dcd2;--ac:#1f3a5f;--on:#fff;--ok:#1b7a45;--bad:#b3401b;--inp:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--card:#1f1d18;--tx:#efece4;--mut:#a39f94;--bd:#34312a;--ac:#8fb0de;--on:#10100e;--ok:#5cc489;--bad:#f08a62;--inp:#27251f}}
:root[data-theme="dark"]{--bg:#15140f;--card:#1f1d18;--tx:#efece4;--mut:#a39f94;--bd:#34312a;--ac:#8fb0de;--on:#10100e;--ok:#5cc489;--bad:#f08a62;--inp:#27251f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:0 0 14px}
h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
button{width:auto;cursor:pointer;background:var(--card)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.full{width:100%;margin-top:12px}
button.s{padding:7px 10px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:22px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:15px 4px;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:700}
summary{cursor:pointer;padding:6px 0}
#msg{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:none;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;text-align:center;z-index:5}
</style>
</head>
<body>
<main>
<section id="t-prod">
<h1>Produtos</h1>
<div class="card">
<h2 id="ftitle" style="margin-top:0">Novo produto</h2>
<label for="n">Nome</label>
<input id="n" placeholder="Ex.: Calça jeans skinny" autocomplete="off">
<div class="grid2">
<div><label for="t">Tamanho</label><input id="t" placeholder="Ex.: 40" autocomplete="off"></div>
<div><label for="q">Quantidade</label><input id="q" type="number" inputmode="numeric" min="0" placeholder="0"></div>
</div>
<div class="grid2">
<div><label for="c">Custo (R$)</label><input id="c" inputmode="decimal" placeholder="80,00"></div>
<div><label for="pr">Preço de venda (R$)</label><input id="pr" inputmode="decimal" placeholder="160,00"></div>
</div>
<div id="mg" class="mut" style="margin-top:8px"></div>
<button class="p full" id="save">Salvar produto</button>
<button class="full" id="cancel" hidden>Cancelar edição</button>
</div>
<div id="list"></div>
</section>

<section id="t-sell" hidden>
<h1>Vender</h1>
<div class="card">
<label for="sp" style="margin-top:0">Peça</label>
<select id="sp"></select>
<div class="grid2">
<div><label for="sq">Quantidade</label><input id="sq" type="number" inputmode="numeric" min="1" value="1"></div>
<div><label for="sv">Preço unitário (R$)</label><input id="sv" inputmode="decimal"></div>
</div>
<label for="sc">Cliente (opcional)</label>
<select id="sc"></select>
<label for="sf">Pagamento</label>
<select id="sf"><option value="0">Pago agora</option><option value="1">Fiado (paga depois)</option></select>
<div id="sinfo" class="mut" style="margin-top:8px"></div>
<button class="p full" id="sell">Registrar venda</button>
</div>
<h2>Últimas vendas</h2>
<div id="hist"></div>
</section>

<section id="t-cli" hidden>
<h1>Clientes</h1>
<div class="card">
<label for="cn" style="margin-top:0">Nome</label>
<input id="cn" placeholder="Ex.: Maria Souza" autocomplete="off">
<label for="ct">Telefone (opcional)</label>
<input id="ct" inputmode="tel" placeholder="(00) 00000-0000">
<button class="p full" id="csave">Salvar cliente</button>
</div>
<div class="card"><div class="mut">Total a receber</div><div class="big" id="ctot">R$ 0,00</div></div>
<div id="clist"></div>
</section>

<section id="t-sum" hidden>
<h1>Resumo</h1>
<select id="per" aria-label="Período">
<option value="0">Hoje</option>
<option value="7">Últimos 7 dias</option>
<option value="30" selected>Últimos 30 dias</option>
<option value="m">Este mês</option>
<option value="all">Tudo</option>
</select>
<div id="sum" style="margin-top:12px"></div>
<h2>Estoque baixo</h2>
<div id="low"></div>
<h2>Backup</h2>
<div class="card">
<p class="mut" style="margin-top:0">Os dados ficam só neste aparelho. Toque em “Baixar backup” e mande o arquivo para você mesma no WhatsApp.</p>
<button class="p full" id="dl" style="margin-top:0">Baixar backup</button>
<label for="bf">Restaurar a partir de um arquivo</label>
<input id="bf" type="file" accept=".txt,.json,text/plain,application/json">
<button class="full" id="rs">Restaurar</button>
<details style="margin-top:14px"><summary class="mut">Usar texto copiado</summary>
<textarea id="bk" rows="5" placeholder="O backup aparece aqui" style="margin-top:8px"></textarea>
<div class="row" style="margin-top:8px"><button id="gen">Gerar backup</button><button id="cp">Copiar</button></div>
</details>
</div>
</section>
</main>

<div id="msg" role="status"></div>
<nav>
<button id="b-prod" onclick="tab('prod')">Produtos</button>
<button id="b-sell" onclick="tab('sell')">Vender</button>
<button id="b-cli" onclick="tab('cli')">Clientes</button>
<button id="b-sum" onclick="tab('sum')">Resumo</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const KEY='meu_estoque_v1';
let S={p:[],v:[],c:[],r:[]},edit=null,del=null,rest=false,tt;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>{s=String(s).trim();if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:NaN};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dec=n=>String(n).replace('.',',');
const nm=p=>esc(p.n)+(p.t?' · '+esc(p.t):'');
const low=p=>p.q<=2;
const cn=id=>(S.c.find(c=>c.id===id)||{n:'cliente removido'}).n;
const owe=id=>S.v.filter(v=>v.cid===id&&v.fiado).reduce((s,v)=>s+v.pr*v.q,0)-S.r.filter(r=>r.cid===id).reduce((s,r)=>s+r.val,0);
function toast(m){const e=$('msg');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{e.style.display='none'},3500)}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.p)&&Array.isArray(d.v))S=d}catch(e){}S.c=S.c||[];S.r=S.r||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste navegador. Gere um backup.')}}
function valid(d){return d&&Array.isArray(d.p)&&Array.isArray(d.v)&&d.p.every(p=>p&&typeof p.id==='string'&&typeof p.n==='string'&&[p.q,p.c,p.pr].every(Number.isFinite))&&d.v.every(v=>v&&typeof v.id==='string'&&typeof v.n==='string'&&[v.q,v.c,v.pr,v.ts].every(Number.isFinite))&&[d.c,d.r].every(x=>x===undefined||Array.isArray(x))&&(d.c||[]).every(c=>c&&typeof c.id==='string'&&typeof c.n==='string')&&(d.r||[]).every(r=>r&&typeof r.cid==='string'&&[r.val,r.ts].every(Number.isFinite))}

function tab(n){
  ['prod','sell','cli','sum'].forEach(k=>{$('t-'+k).hidden=k!==n;$('b-'+k).classList.toggle('on',k===n)});
  del=null;
  if(n==='prod')rList();
  if(n==='sell')rSell();
  if(n==='sum')rSum();
  if(n==='cli')rCli();
  window.scrollTo(0,0);
}

function rList(){
  const L=$('list');
  if(!S.p.length){L.innerHTML='<p class="mut">Nenhum produto cadastrado. Preencha o formulário acima para cadastrar o primeiro.</p>';return}
  L.innerHTML=[...S.p].sort((a,b)=>a.n.localeCompare(b.n,'pt-BR')).map(p=>`<div class="card">
<div class="row between"><b>${nm(p)}</b><span class="${low(p)?'bad':''}">${p.q} un.</span></div>
<div class="mut">Custo ${brl(p.c)} · Preço ${brl(p.pr)} · Lucro ${brl(p.pr-p.c)}</div>
<div class="row" style="margin-top:8px">
<input id="in-${p.id}" type="number" inputmode="numeric" min="1" placeholder="Chegou" aria-label="Quantidade que chegou" style="max-width:92px">
<button class="s" data-a="add" data-id="${p.id}">Adicionar ao estoque</button>
<button class="s" data-a="edit" data-id="${p.id}">Editar</button>
<button class="s" data-a="del" data-id="${p.id}">${del===p.id?'Confirmar exclusão':'Excluir'}</button>
</div></div>`).join('');
}

function fillPrice(){
  const p=S.p.find(x=>x.id===$('sp').value);
  $('sv').value=p?dec(p.pr):'';
  $('sinfo').textContent=p?`Custo ${brl(p.c)} · lucro por peça no preço de tabela ${brl(p.pr-p.c)}`:'';
}
function rSell(){
  const s=$('sp'),cur=s.value,a=S.p.filter(p=>p.q>0);const sc=$('sc'),cc=sc.value;sc.innerHTML='<option value="">Sem cliente</option>'+S.c.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('');if(S.c.some(c=>c.id===cc))sc.value=cc;
  s.innerHTML=a.length?a.map(p=>`<option value="${p.id}">${nm(p)} (${p.q} un.)</option>`).join(''):'<option value="">Nenhuma peça em estoque</option>';
  if(a.some(p=>p.id===cur))s.value=cur;
  fillPrice();
  $('hist').innerHTML=S.v.slice(0,10).map(v=>`<div class="card">
<div class="row between"><b>${nm(v)}</b><span>${brl(v.pr*v.q)}</span></div>
<div class="mut">${v.q} un. · ${new Date(v.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · lucro ${brl((v.pr-v.c)*v.q)}${v.cid?' · '+esc(cn(v.cid))+(v.fiado?' (fiado)':''):''}</div>
<button class="s" data-a="undo" data-id="${v.id}" style="margin-top:8px">Desfazer venda</button></div>`).join('')||'<p class="mut">Nenhuma venda registrada ainda.</p>';
}

function rSum(){
  const m=$('per').value,d0=new Date();d0.setHours(0,0,0,0);
  const from=m==='all'?0:m==='0'?d0.getTime():m==='m'?new Date(d0.getFullYear(),d0.getMonth(),1).getTime():Date.now()-(m==='7'?7:30)*864e5;
  const a=S.v.filter(v=>v.ts>=from);
  const r=a.reduce((s,v)=>s+v.pr*v.q,0),c=a.reduce((s,v)=>s+v.c*v.q,0),l=r-c;
  const est=S.p.reduce((s,p)=>s+p.c*p.q,0),un=S.p.reduce((s,p)=>s+p.q,0);
  const rec=S.c.reduce((s,c)=>s+Math.max(0,owe(c.id)),0);
  $('sum').innerHTML=`<div class="grid2">
<div class="card"><div class="mut">Receita</div><div class="big">${brl(r)}</div></div>
<div class="card"><div class="mut">Lucro</div><div class="big ${l<0?'bad':'ok'}">${brl(l)}</div></div>
<div class="card"><div class="mut">Custo das peças vendidas</div><div class="big">${brl(c)}</div></div>
<div class="card"><div class="mut">Margem</div><div class="big">${r?Math.round(l/r*100)+'%':'—'}</div></div></div>
<div class="card"><div class="mut">Fiado a receber</div><div class="big ${rec>0?'bad':''}">${brl(rec)}</div></div>
<div class="card"><div class="mut">Em estoque agora</div><div><b>${un}</b> peças · ${brl(est)} a preço de custo</div><div class="mut" style="margin-top:6px">${a.length} venda(s) no período. Venda fiado entra na receita e no lucro no dia da venda. Não inclui frete, gasolina nem taxas.</div></div>`;
  const lw=S.p.filter(low);
  $('low').innerHTML=lw.length?lw.map(p=>`<div class="card row between"><span>${nm(p)}</span><b class="bad">${p.q} un.</b></div>`).join(''):'<p class="mut">Nenhuma peça com 2 unidades ou menos.</p>';
}

function mg(){
  const c=num($('c').value),p=num($('pr').value);
  $('mg').textContent=(c>=0&&p>0)?`Lucro por peça: ${brl(p-c)} (${Math.round((p-c)/p*100)}% do preço)`:'';
}
function clearForm(){
  edit=null;['n','t','q','c','pr'].forEach(i=>{$(i).value=''});
  $('ftitle').textContent='Novo produto';$('cancel').hidden=true;mg();
}

$('save').onclick=()=>{
  const n=$('n').value.trim(),t=$('t').value.trim(),q=parseInt($('q').value||'0',10),c=num($('c').value),pr=num($('pr').value);
  if(!n)return toast('Informe o nome da peça.');
  if(!(q>=0))return toast('Quantidade inválida.');
  if(!(c>=0)||!(pr>=0))return toast('Informe o custo e o preço de venda.');
  if(edit){const p=S.p.find(x=>x.id===edit);if(p)Object.assign(p,{n,t,q,c,pr})}
  else S.p.push({id:uid(),n,t,q,c,pr});
  save();clearForm();rList();toast('Produto salvo.');
};
$('cancel').onclick=clearForm;
$('c').oninput=mg;$('pr').oninput=mg;
$('sp').onchange=fillPrice;
$('per').onchange=rSum;

$('sell').onclick=()=>{
  const p=S.p.find(x=>x.id===$('sp').value),q=parseInt($('sq').value,10),v=num($('sv').value);
  if(!p)return toast('Escolha uma peça.');
  if(!(q>=1))return toast('Quantidade inválida.');
  if(q>p.q)return toast('Só há '+p.q+' em estoque.');
  if(!(v>=0))return toast('Preço inválido.');
  const cid=$('sc').value,fiado=$('sf').value==='1';
  if(fiado&&!cid)return toast('Escolha o cliente para vender fiado.');
  p.q-=q;
  S.v.unshift({id:uid(),pid:p.id,n:p.n,t:p.t,q,c:p.c,pr:v,ts:Date.now(),cid,fiado});
  save();$('sq').value=1;$('sf').value='0';rSell();toast('Venda registrada. Lucro: '+brl((v-p.c)*q));
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.dataset.id,a=b.dataset.a,p=S.p.find(x=>x.id===id);
  if(a==='add'&&p){
    const n=parseInt($('in-'+id).value,10);
    if(!(n>=1))return toast('Informe quantas peças chegaram.');
    p.q+=n;save();rList();toast('Estoque atualizado.');
  }else if(a==='edit'&&p){
    edit=id;$('n').value=p.n;$('t').value=p.t||'';$('q').value=p.q;$('c').value=dec(p.c);$('pr').value=dec(p.pr);
    $('ftitle').textContent='Editar produto';$('cancel').hidden=false;mg();window.scrollTo({top:0,behavior:'smooth'});
  }else if(a==='del'&&p){
    if(del===id){S.p=S.p.filter(x=>x.id!==id);del=null;save();toast('Produto excluído.')}else del=id;
    rList();
  }else if(a==='pay'){
    const v=num($('pay-'+id).value),d=owe(id);
    if(!(v>0))return toast('Informe o valor recebido.');
    if(v>d+0.005)return toast('Valor maior que o saldo de '+brl(d)+'.');
    S.r.push({id:uid(),cid:id,val:v,ts:Date.now()});save();rCli();toast('Pagamento registrado.');
  }else if(a==='cdel'){
    if(owe(id)>0.005)return toast('Este cliente ainda deve. Registre o pagamento antes de excluir.');
    if(del===id){S.c=S.c.filter(x=>x.id!==id);S.r=S.r.filter(x=>x.cid!==id);del=null;save();toast('Cliente excluído.')}else del=id;
    rCli();
  }else if(a==='undo'){
    const i=S.v.findIndex(x=>x.id===id);if(i<0)return;
    const v=S.v[i],q=S.p.find(x=>x.id===v.pid);
    if(q)q.q+=v.q;S.v.splice(i,1);save();rSell();toast('Venda desfeita e estoque devolvido.');
  }
});

$('dl').onclick=()=>{
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  const nome='backup-estoque-'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.txt';
  try{
    const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'text/plain'}));
    const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    toast('Backup baixado. No iPhone, ele fica no app Arquivos.');
  }catch(e){toast('Não foi possível baixar. Use o texto copiado.')}
};
$('bf').onchange=async()=>{
  const f=$('bf').files[0];if(!f)return;
  try{$('bk').value=await f.text();rest=false;$('rs').textContent='Restaurar';toast('Arquivo carregado. Toque em Restaurar.')}
  catch(e){toast('Não foi possível ler o arquivo.')}
};
$('gen').onclick=()=>{$('bk').value=JSON.stringify(S);$('bk').select();toast('Backup gerado. Toque em Copiar.')};
$('cp').onclick=async()=>{
  const t=$('bk');if(!t.value)return toast('Gere o backup primeiro.');
  try{await navigator.clipboard.writeText(t.value);toast('Copiado.')}
  catch(e){t.select();try{document.execCommand('copy');toast('Copiado.')}catch(_){toast('Selecione o texto e copie manualmente.')}}
};
$('bk').oninput=()=>{rest=false;$('rs').textContent='Restaurar'};
$('rs').onclick=()=>{
  if(!$('bk').value.trim())return toast('Escolha o arquivo ou cole o texto primeiro.');
  let d;try{d=JSON.parse($('bk').value)}catch(e){return toast('Texto de backup inválido.')}
  if(!valid(d))return toast('Texto de backup inválido.');
  if(!rest){rest=true;$('rs').textContent='Confirmar';return toast('Isso substitui os dados atuais. Toque de novo para confirmar.')}
  S={p:d.p.map(p=>({...p,t:String(p.t||'')})),v:d.v.map(v=>({...v,t:String(v.t||'')})),c:d.c||[],r:d.r||[]};
  rest=false;$('rs').textContent='Restaurar';$('bf').value='';save();rSum();toast('Backup restaurado.');
};

function rCli(){
  $('ctot').textContent=brl(S.c.reduce((s,c)=>s+Math.max(0,owe(c.id)),0));
  $('clist').innerHTML=S.c.length?[...S.c].sort((a,b)=>a.n.localeCompare(b.n,'pt-BR')).map(c=>{const d=owe(c.id),dv=d>0.005;return `<div class="card"><div class="row between"><b>${esc(c.n)}</b><span class="${dv?'bad':'ok'}">${dv?'Deve '+brl(d):'Em dia'}</span></div>${c.tel?`<div class="mut">${esc(c.tel)}</div>`:''}<div class="row" style="margin-top:8px">${dv?`<input id="pay-${c.id}" inputmode="decimal" placeholder="Valor recebido" aria-label="Valor recebido" style="max-width:140px"><button class="s" data-a="pay" data-id="${c.id}">Registrar pagamento</button>`:''}<button class="s" data-a="cdel" data-id="${c.id}">${del===c.id?'Confirmar exclusão':'Excluir'}</button></div></div>`}).join(''):'<p class="mut">Nenhum cliente cadastrado ainda.</p>';
}
$('csave').onclick=()=>{
  const n=$('cn').value.trim(),tel=$('ct').value.trim();
  if(!n)return toast('Informe o nome do cliente.');
  S.c.push({id:uid(),n,tel});save();$('cn').value='';$('ct').value='';rCli();toast('Cliente salvo.');
};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
load();tab('prod');
</script>
</body>
</html>
